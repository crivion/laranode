<VirtualHost *:80>
        ServerAdmin webmaster@localhost
        DocumentRoot /opt/laranode/public

        <Directory /opt/laranode/public>
                Options FollowSymLinks
                AllowOverride All
                Require all granted
        </Directory>

        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
