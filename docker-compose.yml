# Laranode in Docker
#
#   docker compose up -d --build
#   docker compose logs -f            # first boot compiles assets, give it a few minutes
#   docker compose exec laranode laranode-artisan laranode:create-admin
#
# Laranode manages system users, Apache, PHP-FPM, MySQL and UFW inside the container,
# so it runs systemd as PID 1 and needs a privileged container. Dropping privileged
# costs systemd the ability to set up its per-unit sandboxes, and it then forces
# NoNewPrivileges on, which stops the panel running its own scripts through sudo.
# Optional overrides go in a .env file next to this file (see the variables below).

services:
    laranode:
        build: .
        image: laranode:latest
        container_name: laranode
        hostname: laranode
        privileged: true
        tty: true
        stop_signal: SIGRTMIN+3
        stop_grace_period: 1m
        restart: unless-stopped
        tmpfs:
            - /run
            - /run/lock
        ports:
            - "${LARANODE_HTTP_PORT:-80}:80"
            - "${LARANODE_HTTPS_PORT:-443}:443"
            - "${LARANODE_REVERB_PORT:-8080}:8080"
            - "${LARANODE_SSH_PORT:-2222}:22"
        environment:
            # public URL of the panel
            LARANODE_URL: "${LARANODE_URL:-http://localhost}"
            # where browsers reach the reverb websocket server (defaults to the LARANODE_URL host)
            LARANODE_REVERB_HOST: "${LARANODE_REVERB_HOST:-}"
            LARANODE_REVERB_PORT: "${LARANODE_REVERB_PORT:-8080}"
            LARANODE_REVERB_SCHEME: "${LARANODE_REVERB_SCHEME:-http}"
            # the port accounts with shell access connect to, shown in the panel
            LARANODE_SSH_PORT: "${LARANODE_SSH_PORT:-2222}"
            # optional: create the admin account on first boot instead of running laranode:create-admin
            LARANODE_ADMIN_NAME: "${LARANODE_ADMIN_NAME:-}"
            LARANODE_ADMIN_EMAIL: "${LARANODE_ADMIN_EMAIL:-}"
            LARANODE_ADMIN_PASSWORD: "${LARANODE_ADMIN_PASSWORD:-}"
            TZ: "${TZ:-UTC}"
        volumes:
            # panel .env and snapshot of system users, vhosts, PHP-FPM pools and firewall rules
            - laranode-state:/var/lib/laranode
            - laranode-backups:/var/lib/laranode/backups
            - laranode-storage:/opt/laranode/storage
            # hosting accounts (websites, logs)
            - laranode-home:/home
            - laranode-mysql:/var/lib/mysql
            - laranode-letsencrypt:/etc/letsencrypt
            # sar history for the stats pages
            - laranode-sysstat:/var/log/sysstat

volumes:
    laranode-state:
    laranode-backups:
    laranode-storage:
    laranode-home:
    laranode-mysql:
    laranode-letsencrypt:
    laranode-sysstat:
